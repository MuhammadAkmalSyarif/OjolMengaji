<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#064e3b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ojol Mengaji - Pembinaan Tilawah Al-Qur'an Mitra Pengemudi</title>
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
    <link rel="apple-touch-icon" href="assets/logo.jpg">

    <!-- Google Fonts: Plus Jakarta Sans & Amiri -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        arabic: ['"Amiri"', 'serif']
                    },
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                            950: '#022c22'
                        },
                        gold: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            200: '#fde68a',
                            300: '#fcd34d',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309'
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02)',
                        'card': '0 10px 25px -5px rgba(6, 78, 59, 0.08), 0 8px 10px -6px rgba(6, 78, 59, 0.04)',
                        'glow': '0 0 25px -3px rgba(16, 185, 129, 0.35)',
                        'modal': '0 25px 50px -12px rgba(0, 0, 0, 0.25)'
                    }
                }
            }
        }
    </script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- HTML5 QR Camera Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at 50% 20%, #064e3b 0%, #022c22 45%, #051410 100%);
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
            color: #1e293b;
        }

        /* Subtle Islamic Geometric Motif Overlay on Desktop Background */
        .bg-pattern {
            background-image: radial-gradient(rgba(16, 185, 129, 0.07) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Mobile Device Mockup Frame */
        .device-wrapper {
            max-width: 440px;
            width: 100%;
            min-height: 100vh;
            margin: 0 auto;
            background-color: #f8fafc;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            body { padding: 32px 16px; display: flex; justify-content: center; align-items: center; }
            .device-wrapper {
                min-height: 870px;
                max-height: 92vh;
                border-radius: 44px;
                border: 9px solid #1e293b;
                box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
            }
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Smooth tab & card animations */
        .page-enter { animation: pageEnter 0.28s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes pageEnter {
            from { opacity: 0; transform: translateY(8px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Pulse radar ring */
        @keyframes radarSweep {
            0% { transform: scale(0.7); opacity: 0.9; }
            100% { transform: scale(2.2); opacity: 0; }
        }
        .radar-pulse { animation: radarSweep 2.2s infinite cubic-bezier(0.2, 0.8, 0.2, 1); }
    </style>
</head>
<body class="bg-pattern">
    <div id="root" class="w-full flex justify-center"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const API_BASE = window.location.origin.includes('http') ? window.location.origin : 'http://localhost:3000';

        const LEVEL_TITLES = [
            "Iqro 1-2 • Pengenalan Huruf",
            "Iqro 3-4 • Huruf Sambung & Harakat",
            "Iqro 5-6 • Kalimat & Kelancaran",
            "Juz 'Amma • Tajwid & Tartil Dasar",
            "Al-Qur'an 30 Juz • Tartil Mandiri"
        ];

        const LEVEL_DESCRIPTIONS = [
            "Fokus pada identifikasi huruf hijaiyah tunggal dan pelafalan harakat dasar (fathah, kasrah, dhammah).",
            "Mulai membaca huruf sambung 2-3 karakter, mengenal tanwin, sukun, dan mad thabi'i 2 harakat.",
            "Melatih konsistensi bacaan, kelancaran merangkai kata, mengenal hukum waqaf dan tasydid.",
            "Membaca surat-surat pendek dalam Juz 30 dengan penerapan hukum nun mati, mim mati, dan qalqalah.",
            "Membaca Al-Qur'an secara fasih, makharijul huruf tepat, sifatul huruf terjaga, dan tartil konsisten."
        ];

        // --- MODERN VECTOR ICONS ---
        const IconHome = ({ active }) => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill={active ? "currentColor" : "none"} stroke="currentColor" strokeWidth={active ? "1.5" : "2"} strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const IconScan = ({ active }) => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={active ? "2.5" : "2"} strokeLinecap="round" strokeLinejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.5"/></svg>;
        const IconBook = ({ active }) => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill={active ? "currentColor" : "none"} stroke="currentColor" strokeWidth={active ? "1.5" : "2"} strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2h0Z"/></svg>;
        const IconUser = ({ active }) => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill={active ? "currentColor" : "none"} stroke="currentColor" strokeWidth={active ? "1.5" : "2"} strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const IconMapPin = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
        const IconCheckCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
        const IconQr = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg>;
        const IconChevronRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;
        const IconCopy = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>;
        const IconSparkles = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>;

        // --- APP ROOT ---
        const App = () => {
            const [db, setDb] = useState({ users: [], shelters: [], sessions: [], attendances: [], assessments: [] });
            const [serverOnline, setServerOnline] = useState(false);
            const [authUser, setAuthUser] = useState(() => {
                const saved = localStorage.getItem('om_user_auth');
                return saved ? JSON.parse(saved) : null;
            });
            const [currentView, setCurrentView] = useState('home');
            const [toast, setToast] = useState({ show: false, msg: '', type: 'info' });
            const [currentTime, setCurrentTime] = useState('');

            // Digital clock update
            useEffect(() => {
                const updateTime = () => {
                    const now = new Date();
                    setCurrentTime(now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }));
                };
                updateTime();
                const timer = setInterval(updateTime, 30000);
                return () => clearInterval(timer);
            }, []);

            const showToast = (msg, type = 'info') => {
                setToast({ show: true, msg, type });
                setTimeout(() => setToast({ show: false, msg: '', type: 'info' }), 3800);
            };

            // Sync with Localhost REST API
            const syncWithServer = async () => {
                try {
                    const res = await fetch(`${API_BASE}/api/bootstrap`);
                    if (res.ok) {
                        const json = await res.json();
                        if (json.success && json.data) {
                            setDb(json.data);
                            setServerOnline(true);
                            if (authUser) {
                                const currentInDb = json.data.users.find(u => u.id === authUser.id);
                                if (currentInDb && currentInDb.level !== authUser.level) {
                                    const updated = { ...authUser, level: currentInDb.level };
                                    setAuthUser(updated);
                                    localStorage.setItem('om_user_auth', JSON.stringify(updated));
                                }
                            }
                        }
                    }
                } catch (err) {
                    setServerOnline(false);
                }
            };

            useEffect(() => {
                syncWithServer();
                const interval = setInterval(syncWithServer, 2500);
                return () => clearInterval(interval);
            }, [authUser?.id]);

            const handleLogin = async (username, password) => {
                try {
                    const res = await fetch(`${API_BASE}/api/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    if (data.success && data.user) {
                        setAuthUser(data.user);
                        localStorage.setItem('om_user_auth', JSON.stringify(data.user));
                        setCurrentView('home');
                        showToast(`Ahlan wa Sahlan, ${data.user.name}!`, 'success');
                        syncWithServer();
                    } else {
                        showToast(data.message || 'Username atau password salah', 'error');
                    }
                } catch (err) {
                    showToast('Gagal menghubungi backend server!', 'error');
                }
            };

            const handleLogout = () => {
                setAuthUser(null);
                localStorage.removeItem('om_user_auth');
                setCurrentView('home');
                showToast('Berhasil keluar dari akun.', 'info');
            };

            return (
                <div className="device-wrapper shadow-2xl">
                    {/* Simulated Mobile Status Bar */}
                    <div className="bg-brand-950 text-white/90 px-6 pt-3 pb-1 flex justify-between items-center text-[11px] font-semibold tracking-tight select-none">
                        <span>{currentTime || '21:00'}</span>
                        <div className="flex items-center space-x-2">
                            <span className="flex items-center space-x-1">
                                <span className={`w-1.5 h-1.5 rounded-full ${serverOnline ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                                <span className="text-[10px] text-emerald-200/90 font-medium">{serverOnline ? 'Online' : 'Offline'}</span>
                            </span>
                            <span className="text-[10px] bg-white/10 px-1.5 py-0.5 rounded font-mono">5G</span>
                            <span>98%</span>
                        </div>
                    </div>

                    {/* App Bar / Navigation Header */}
                    {authUser && (
                        <header className="bg-gradient-to-r from-brand-900 via-brand-800 to-brand-900 text-white px-4 py-3 shadow-md flex justify-between items-center sticky top-0 z-40 border-b border-brand-700/50">
                            <div className="flex items-center space-x-3">
                                <div className="relative">
                                    <img src="assets/logo.jpg" alt="Logo" className="w-9 h-9 rounded-full border-2 border-gold-400/80 object-cover shadow-sm bg-white" />
                                    <span className="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-400 border-2 border-brand-900 rounded-full"></span>
                                </div>
                                <div>
                                    <div className="flex items-center space-x-1.5">
                                        <h1 className="text-sm font-extrabold tracking-tight">Ojol Mengaji</h1>
                                        <span className="text-[9px] font-bold uppercase tracking-wider bg-gold-400/20 text-gold-300 border border-gold-400/30 px-1.5 py-0.2 rounded">
                                            Hidayatullah
                                        </span>
                                    </div>
                                    <p className="text-[10px] text-brand-200 font-medium">Binaan Tilawah Pengemudi</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center space-x-2">
                                <span className="text-[10px] bg-white/10 text-white px-2 py-0.5 rounded-full font-semibold capitalize border border-white/10">
                                    {authUser.role.replace('_', ' ')}
                                </span>
                                <button 
                                    onClick={handleLogout} 
                                    title="Keluar Akun"
                                    className="text-[11px] bg-brand-950/60 hover:bg-red-900/80 text-white/90 px-2.5 py-1 rounded-lg border border-white/10 transition active:scale-95"
                                >
                                    Keluar
                                </button>
                            </div>
                        </header>
                    )}

                    {/* Floating Toast Notification */}
                    {toast.show && (
                        <div className={`fixed top-14 left-1/2 transform -translate-x-1/2 z-50 text-xs px-4 py-3 rounded-xl shadow-modal w-11/12 max-w-sm text-center font-semibold animate-fade-in flex items-center justify-center space-x-2 ${
                            toast.type === 'error' ? 'bg-red-600 text-white' :
                            toast.type === 'success' ? 'bg-brand-800 border border-emerald-400/30 text-white' :
                            'bg-slate-900 text-white border border-slate-700'
                        }`}>
                            <span>{toast.msg}</span>
                        </div>
                    )}

                    {/* Main Content Area */}
                    <main className="flex-1 overflow-y-auto p-4 pb-24 hide-scrollbar">
                        {!authUser ? (
                            <LoginScreen onLogin={handleLogin} serverOnline={serverOnline} />
                        ) : (
                            <div className="page-enter">
                                {currentView === 'home' && (
                                    <Dashboard 
                                        user={authUser} 
                                        db={db} 
                                        syncWithServer={syncWithServer} 
                                        showToast={showToast} 
                                        setCurrentView={setCurrentView} 
                                    />
                                )}
                                {currentView === 'scan' && (
                                    <ScanScreen 
                                        user={authUser} 
                                        db={db} 
                                        syncWithServer={syncWithServer} 
                                        showToast={showToast} 
                                        setCurrentView={setCurrentView} 
                                    />
                                )}
                                {currentView === 'asesmen' && (
                                    <AssessmentScreen 
                                        user={authUser} 
                                        db={db} 
                                        syncWithServer={syncWithServer} 
                                        showToast={showToast} 
                                    />
                                )}
                                {currentView === 'profile' && (
                                    <ProfileScreen 
                                        user={authUser} 
                                        db={db} 
                                        serverOnline={serverOnline}
                                        onLogout={handleLogout} 
                                    />
                                )}
                            </div>
                        )}
                    </main>

                    {/* Bottom Navigation Dock */}
                    {authUser && (
                        <nav className="bg-white/95 backdrop-blur-md border-t border-slate-200/80 flex justify-around py-2 px-2 absolute bottom-0 w-full z-40 shadow-soft">
                            <NavButton 
                                icon={<IconHome active={currentView === 'home'} />} 
                                label="Beranda" 
                                active={currentView === 'home'} 
                                onClick={() => setCurrentView('home')} 
                            />
                            {authUser.role === 'peserta' && (
                                <NavButton 
                                    icon={<IconScan active={currentView === 'scan'} />} 
                                    label="Presensi" 
                                    active={currentView === 'scan'} 
                                    onClick={() => setCurrentView('scan')} 
                                    badge={db.sessions?.some(s => s.status === 'active' && s.shelter_id === authUser.shelter_id)}
                                />
                            )}
                            {authUser.role === 'guru' && (
                                <NavButton 
                                    icon={<IconBook active={currentView === 'asesmen'} />} 
                                    label="Asesmen" 
                                    active={currentView === 'asesmen'} 
                                    onClick={() => setCurrentView('asesmen')} 
                                />
                            )}
                            <NavButton 
                                icon={<IconUser active={currentView === 'profile'} />} 
                                label="Profil" 
                                active={currentView === 'profile'} 
                                onClick={() => setCurrentView('profile')} 
                            />
                        </nav>
                    )}
                </div>
            );
        };

        const NavButton = ({ icon, label, active, onClick, badge }) => (
            <button 
                onClick={onClick} 
                className={`relative flex flex-col items-center justify-center py-1 px-4 rounded-xl transition duration-150 active:scale-95 ${
                    active ? 'text-brand-700 font-bold' : 'text-slate-400 hover:text-slate-600 font-medium'
                }`}
            >
                {icon}
                <span className="text-[10px] mt-1 tracking-tight">{label}</span>
                {badge && (
                    <span className="absolute top-1 right-3.5 w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span>
                )}
            </button>
        );

        // --- MODERN LOGIN SCREEN ---
        const LoginScreen = ({ onLogin, serverOnline }) => {
            const [username, setUsername] = useState('ojol1');
            const [password, setPassword] = useState('123');

            const quickLogin = (u, p) => {
                setUsername(u);
                setPassword(p);
                onLogin(u, p);
            };

            return (
                <div className="page-enter space-y-4 py-2">
                    {/* Hero Card with Real Image Background */}
                    <div className="relative rounded-3xl overflow-hidden shadow-card border border-brand-800/30">
                        <img src="assets/hero.jpg" alt="Hero Ojol Mengaji" className="w-full h-44 object-cover" />
                        <div className="absolute inset-0 bg-gradient-to-t from-brand-950 via-brand-950/70 to-transparent flex flex-col justify-end p-5 text-white">
                            <div className="flex items-center space-x-2 mb-1.5">
                                <img src="assets/logo.jpg" alt="Logo" className="w-8 h-8 rounded-full border border-gold-400 object-cover bg-white" />
                                <span className="text-xs font-bold text-gold-300 tracking-wider uppercase">Sinergi Pembinaan Umat</span>
                            </div>
                            <h2 className="text-xl font-extrabold leading-snug">Ojol Mengaji</h2>
                            <p className="text-xs text-brand-100 font-medium mt-0.5">Gerakan Literasi Al-Qur'an Sahabat Ojol Se-Jabodetabek</p>
                        </div>
                    </div>

                    {/* Status Pill */}
                    <div className="flex justify-between items-center bg-white px-4 py-2 rounded-xl border border-slate-200 text-xs shadow-soft">
                        <span className="text-slate-500 font-medium">Status Koneksi Server</span>
                        <span className={`inline-flex items-center font-bold px-2.5 py-0.5 rounded-full text-[10px] ${
                            serverOnline ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-amber-50 text-amber-700 border border-amber-200'
                        }`}>
                            <span className={`w-1.5 h-1.5 rounded-full mr-1.5 ${serverOnline ? 'bg-emerald-500' : 'bg-amber-500'}`}></span>
                            {serverOnline ? 'Localhost Backend Aktif (Port 3000)' : 'Menghubungkan Server...'}
                        </span>
                    </div>

                    {/* Login Card */}
                    <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-card space-y-4">
                        <div className="border-b border-slate-100 pb-2">
                            <h3 className="text-sm font-bold text-slate-800">Masuk Akun Pengguna</h3>
                            <p className="text-[11px] text-slate-400">Silakan gunakan akun binaan yang telah terdaftar</p>
                        </div>

                        <div className="space-y-3">
                            <div>
                                <label className="block text-xs font-bold text-slate-600 mb-1">Username</label>
                                <input 
                                    type="text" 
                                    value={username} 
                                    onChange={e => setUsername(e.target.value)} 
                                    className="w-full px-3.5 py-2.5 text-xs font-medium border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none bg-slate-50/50" 
                                    placeholder="Username akun" 
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-600 mb-1">Password</label>
                                <input 
                                    type="password" 
                                    value={password}

        // --- DASHBOARD ROUTER ---

            if (user.role === 'admin_shelter' || user.role === 'admin_program') return <DashboardAdmin user={user} db={db} syncWithServer={syncWithServer} showToast={showToast} />;
            return null;
        };

        // --- 1. DASHBOARD PESERTA (MITRA OJOL) ---

            const myAttendances = (db.attendances || []).filter(a => a.user_id === user.id);

                    {/* Milestone Progress Stepper */}
                    <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-card space-y-3">

                                            <p className="font-bold text-slate-800">{new Date(att.timestamp).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short' })}</p>

                                        </div>
                                        <span className="text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full flex items-center space-x-1">
                                            <IconCheckCircle />
                                            <span>Valid</span>
                                        </span>
                                    </div>

                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- 2. DASHBOARD GURU (USTADZ PEMBINA) ---
        const DashboardGuru = ({ user, db, syncWithServer, showToast, setCurrentView }) => {
            const shelter = (db.shelters || []).find(s => s.id === user.shelter_id) || db.shelters?.[0] || { name: 'Shelter Sudirman' };
            const activeSession = (db.sessions || []).find(s => s.teacher_id === user.id && s.status === 'active');
            const myStudents = (db.users || []).filter(u => u.role === 'peserta' && u.shelter_id === user.shelter_id);
            const qrCanvasRef = useRef(null);

            const openSession = async () => {
                if (activeSession) return showToast('Sesi sudah aktif!', 'error');
                try {
                    const res = await fetch(`${API_BASE}/api/sessions/open`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ teacher_id: user.id, shelter_id: user.shelter_id })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast(`Sesi dibuka! Token QR: ${data.session.qr_token}`, 'success');
                        syncWithServer();
                    }
                } catch (e) {
                    showToast('Gagal menghubungi server!', 'error');
                }
            };

            const closeSession = async () => {
                if (!activeSession) return;
                try {
                    const res = await fetch(`${API_BASE}/api/sessions/close`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: activeSession.id, teacher_id: user.id })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast('Sesi mengaji ditutup.', 'info');
                        syncWithServer();
                    }
                } catch (e) {
                    showToast('Gagal menutup sesi!', 'error');
                }
            };

            // Render high-res QR Code canvas
            useEffect(() => {
                if (activeSession && qrCanvasRef.current && window.QRCode) {
                    qrCanvasRef.current.innerHTML = '';
                    new QRCode(qrCanvasRef.current, {
                        text: activeSession.qr_token,
                        width: 180,
                        height: 180,
                        colorDark: "#064e3b",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }
            }, [activeSession?.qr_token]);

            const sessionAttendances = activeSession ? (db.attendances || []).filter(a => a.session_id === activeSession.id) : [];

            return (
                <div className="space-y-4">
                    {/* Header Guru */}
                    <div className="bg-gradient-to-r from-brand-900 to-teal-900 text-white p-5 rounded-3xl shadow-card">
                        <span className="text-[10px] bg-white/20 px-2 py-0.5 rounded-full font-bold uppercase tracking-wider text-emerald-200">
                            Asatidz Pembimbing Halaqah

                        <h2 className="text-lg font-black mt-1">{user.name}</h2>
                        <p className="text-xs text-brand-200 flex items-center mt-0.5">

                            <span className="ml-1 font-medium">{shelter.name}</span>

                                            <IconCopy />
                                            <span>Salin</span>
                                        </button>

                                    >
                                        Tutup Sesi
                                    </button>
                                </div>
                            </div>

                                                    Nilai

                                    </div>
                                );
                            })}

            );

        // --- 3. DASHBOARD ADMIN (PROGRAM & SHELTER) ---
        const DashboardAdmin = ({ user, db, syncWithServer, showToast }) => {
            const [selectedTab, setSelectedTab] = useState('summary');
            const totalPeserta = (db.users || []).filter(u => u.role === 'peserta').length;
            const totalGuru = (db.users || []).filter(u => u.role === 'guru').length;
            const totalSesi = (db.sessions || []).length;
            const totalHadir = (db.attendances || []).length;

            const handleResetDB = async () => {
                if (!confirm('Apakah Anda yakin ingin me-reset database server ke data awal contoh?')) return;
                try {
                    const res = await fetch(`${API_BASE}/api/admin/reset`, { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        showToast('Database server di-reset.', 'success');
                        syncWithServer();
                    }
                } catch (e) {
                    showToast('Gagal mereset database!', 'error');
                }
            };

            return (
                <div className="space-y-4">
                    <div className="bg-gradient-to-r from-slate-900 to-brand-950 text-white p-5 rounded-3xl shadow-card">
                        <span className="text-[10px] bg-white/20 px-2 py-0.5 rounded-full font-bold uppercase tracking-wider text-emerald-300">

                        </span>

                    <div className="grid grid-cols-2 gap-3">
                        <div className="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-soft text-center">
                            <span className="text-2xl font-black text-slate-800">{totalPeserta}</span>
                            <span className="block text-[11px] font-bold text-slate-500">Santri Ojol</span>

                        <div className="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-soft text-center">

                        <div className="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-soft text-center">

                        <button 
                            onClick={() => setSelectedTab('summary')} 
                            className={`flex-1 py-2 text-xs font-bold text-center transition ${selectedTab === 'summary' ? 'text-brand-700 border-b-2 border-brand-700' : 'text-slate-400'}`}
                        >
                            Log Presensi Realtime
                        </button>
                        <button 
                            onClick={() => setSelectedTab('students')} 
                            className={`flex-1 py-2 text-xs font-bold text-center transition ${selectedTab === 'students' ? 'text-brand-700 border-b-2 border-brand-700' : 'text-slate-400'}`}
                        >
                            Sebaran Level Santri
                        </button>
                    </div>

                    {selectedTab === 'summary' && (
                        <div className="bg-white p-4 rounded-b-2xl border border-t-0 border-slate-100 shadow-card space-y-2.5">
                            <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wide">
                                Audit Log Kehadiran Terakhir ({totalHadir})
                            </h3>
                            {totalHadir === 0 ? (
                                <p className="text-xs text-slate-400 text-center py-4">Belum ada data presensi.</p>
                            ) : (
                                <div className="space-y-2">
                                    {(db.attendances || []).slice().reverse().map((att, idx) => {
                                        const student = (db.users || []).find(u => u.id === att.user_id);
                                        return (
                                            <div key={idx} className="p-3 bg-slate-50/80 rounded-xl text-xs border border-slate-100 flex justify-between items-center">
                                                <div>
                                                    <p className="font-bold text-slate-800">{student ? student.name : att.user_name || 'Santri Ojol'}</p>
                                                    <p className="text-[10px] text-slate-500">
                                                        GPS Distance: <b className="text-brand-700">{att.distance_meters}m</b> • {new Date(att.timestamp).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })} WIB
                                                    </p>
                                                </div>
                                                <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2.5 py-0.5 rounded-full">
                                                    Sah / Valid
                                                </span>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    )}

                    {selectedTab === 'students' && (
                        <div className="bg-white p-4 rounded-b-2xl border border-t-0 border-slate-100 shadow-card space-y-2">
                            {(db.users || []).filter(u => u.role === 'peserta').map(student => (
                                <div key={student.id} className="p-3 bg-slate-50/80 rounded-xl text-xs flex justify-between items-center border border-slate-100">
                                    <div>
                                        <p className="font-bold text-slate-800">{student.name}</p>
                                        <p className="text-[10px] text-slate-500">{LEVEL_TITLES[student.level || 0]}</p>
                                    </div>
                                    <span className="text-xs font-bold text-brand-800 bg-brand-50 border border-brand-200 px-2.5 py-1 rounded-lg">
                                        Level {student.level !== undefined ? student.level : 0}
                                    </span>
                                </div>
                            ))}
                        </div>
                    )}

                    <div className="pt-2">
                        <button 
                            onClick={handleResetDB} 
                            className="w-full text-xs text-slate-400 hover:text-red-600 py-2.5 border border-dashed border-slate-300 rounded-xl transition"
                        >
                            Reset Database Server ke Awal
                        </button>
                    </div>
                </div>
            );
        };

        // --- 4. SCREEN PRESENSI (SCAN & GPS RADAR) ---
        const ScanScreen = ({ user, db, syncWithServer, showToast, setCurrentView }) => {
            const [qrInput, setQrInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [gpsMode, setGpsMode] = useState('simulated_valid');
            const [cameraActive, setCameraActive] = useState(false);
            const scannerRef = useRef(null);

            const shelter = (db.shelters || []).find(s => s.id === user.shelter_id) || db.shelters?.[0] || { radius: 75, lat: -6.2, lng: 106.816666 };
            const activeSession = (db.sessions || []).find(s => s.status === 'active' && s.shelter_id === user.shelter_id);

            const toggleCamera = () => {
                if (cameraActive) {
                    if (scannerRef.current) {
                        scannerRef.current.stop().then(() => {
                            scannerRef.current.clear();
                            setCameraActive(false);
                        }).catch(() => setCameraActive(false));
                    }
                } else {
                    setCameraActive(true);
                    setTimeout(() => {
                        try {
                            const html5QrCode = new Html5Qrcode("reader");
                            scannerRef.current = html5QrCode;
                            html5QrCode.start(
                                { facingMode: "environment" },
                                { fps: 10, qrbox: 220 },
                                (decodedText) => {
                                    setQrInput(decodedText);
                                    html5QrCode.stop().then(() => {
                                        html5QrCode.clear();
                                        setCameraActive(false);
                                        showToast('QR terdeteksi: ' + decodedText, 'success');
                                    });
                                },
                                () => {}
                            ).catch(err => {
                                showToast('Tidak dapat membuka kamera: ' + err.message, 'error');
                                setCameraActive(false);
                            });
                        } catch (err) {
                            showToast('Gagal memuat modul kamera scanner.', 'error');
                            setCameraActive(false);
                        }
                    }, 300);
                }
            };

            const sendAttendance = async (lat, lng) => {
                try {
                    const res = await fetch(`${API_BASE}/api/attendances`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            session_id: activeSession.id,
                            user_id: user.id,
                            lat,
                            lng,
                            qr_token: qrInput.trim().toUpperCase()
                        })
                    });

                    const data = await res.json();
                    setLoading(false);

                    if (data.success) {
                        showToast(data.message, 'success');
                        syncWithServer();
                        setCurrentView('home');
                    } else {
                        showToast(data.message, 'error');
                    }
                } catch (e) {
                    setLoading(false);
                    showToast('Gagal memvalidasi ke server!', 'error');
                }
            };

            const handlePresensi = () => {
                if (!qrInput.trim()) return showToast("Masukkan atau scan Token QR!", 'error');
                if (!activeSession) return showToast("Tidak ada sesi mengaji aktif di shelter ini.", 'error');

                setLoading(true);

                if (gpsMode === 'real') {
                    if (!navigator.geolocation) {
                        setLoading(false);
                        return showToast('Sensor GPS tidak didukung.', 'error');
                    }
                    navigator.geolocation.getCurrentPosition(
                        (pos) => sendAttendance(pos.coords.latitude, pos.coords.longitude),
                        (err) => {
                            setLoading(false);
                            showToast('Gagal membaca GPS: ' + err.message, 'error');
                        },
                        { enableHighAccuracy: true, timeout: 8000 }
                    );
                } else if (gpsMode === 'simulated_valid') {
                    sendAttendance(-6.200020, 106.816680); // ~18m (Valid)
                } else {
                    sendAttendance(-6.202500, 106.821000); // ~500m (Invalid)
                }
            };

            return (
                <div className="space-y-4">
                    {/* Visual Radar Header */}
                    <div className="bg-white p-5 rounded-3xl border border-slate-100 shadow-card text-center relative overflow-hidden">
                        <div className="relative w-20 h-20 mx-auto mb-3 flex items-center justify-center">
                            <div className="absolute inset-0 rounded-full bg-emerald-100 radar-pulse"></div>
                            <div className="relative w-16 h-16 bg-gradient-to-tr from-brand-700 to-brand-500 text-white rounded-full flex items-center justify-center shadow-glow">
                                <IconScan active={false} />
                            </div>
                        </div>

                        <h2 className="text-base font-extrabold text-slate-800">Presensi Kehadiran Geolocation</h2>
                        <p className="text-xs text-slate-500 mt-1 max-w-xs mx-auto">
                            Verifikasi ganda: QR Token Dinamis & Jarak Geofence Shelter (Maks. {shelter.radius} Meter)
                        </p>

                        {/* Camera Scanner View */}
                        {cameraActive && (
                            <div className="mt-4 p-2 bg-slate-900 rounded-2xl overflow-hidden shadow-modal">
                                <div id="reader" className="w-full"></div>
                                <button 
                                    onClick={toggleCamera} 
                                    className="mt-2 text-xs bg-red-600 text-white font-bold py-1.5 px-4 rounded-lg"
                                >
                                    Tutup Kamera
                                </button>
                            </div>
                        )}

                        <div className="mt-5 space-y-4 text-left">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Token Sesi QR</label>
                                <div className="flex space-x-2">
                                    <input 
                                        type="text" 
                                        value={qrInput} 
                                        onChange={e => setQrInput(e.target.value)} 
                                        placeholder="Cth: OM-SDR-XXXX" 
                                        className="flex-1 px-3.5 py-2.5 border border-slate-200 rounded-xl text-center font-mono font-bold tracking-widest uppercase text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none bg-slate-50/50"
                                    />
                                    <button 
                                        onClick={toggleCamera} 
                                        className="bg-brand-50 hover:bg-brand-100 border border-brand-200 text-brand-800 px-3.5 py-2 rounded-xl text-xs font-bold flex items-center space-x-1"
                                    >
                                        <span>📷 Kamera</span>
                                    </button>
                                </div>

                                {activeSession && (
                                    <div className="mt-1.5">
                                        <button 
                                            onClick={() => setQrInput(activeSession.qr_token)} 
                                            className="text-[11px] text-brand-700 hover:underline font-semibold"
                                        >
                                            ⚡ Isi Cepat dengan Token Sesi Aktif ({activeSession.qr_token})
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* GPS Segmented Mode */}
                            <div className="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 space-y-2">
                                <span className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider">
                                    Mode Geolocation (Uji Radius 75m):
                                </span>
                                <div className="space-y-1.5 text-xs">
                                    <label className="flex items-center space-x-2.5 p-1.5 rounded-lg hover:bg-white cursor-pointer transition">
                                        <input 
                                            type="radio" 
                                            name="gps" 
                                            checked={gpsMode === 'simulated_valid'} 
                                            onChange={() => setGpsMode('simulated_valid')} 
                                            className="text-brand-600 focus:ring-brand-500"
                                        />
                                        <span className="font-semibold text-slate-700">Simulasi: Dalam Shelter (~18m) <b className="text-emerald-700">[Sah]</b></span>
                                    </label>
                                    <label className="flex items-center space-x-2.5 p-1.5 rounded-lg hover:bg-white cursor-pointer transition">
                                        <input 
                                            type="radio" 
                                            name="gps" 
                                            checked={gpsMode === 'simulated_invalid'} 
                                            onChange={() => setGpsMode('simulated_invalid')} 
                                            className="text-brand-600 focus:ring-brand-500"
                                        />
                                        <span className="font-semibold text-slate-700">Simulasi: Luar Radius (~500m) <b className="text-red-600">[Ditolak]</b></span>
                                    </label>
                                    <label className="flex items-center space-x-2.5 p-1.5 rounded-lg hover:bg-white cursor-pointer transition">
                                        <input 
                                            type="radio" 
                                            name="gps" 
                                            checked={gpsMode === 'real'} 
                                            onChange={() => setGpsMode('real')} 
                                            className="text-brand-600 focus:ring-brand-500"
                                        />
                                        <span className="font-semibold text-slate-700">Sensor GPS Asli Perangkat Fisik</span>
                                    </label>
                                </div>
                            </div>

                            <button 
                                onClick={handlePresensi} 
                                disabled={loading}
                                className={`w-full font-bold py-3.5 rounded-xl shadow-card transition text-xs flex items-center justify-center space-x-1.5 ${
                                    loading ? 'bg-slate-400 cursor-not-allowed' : 'bg-gradient-to-r from-brand-700 to-brand-800 hover:from-brand-800 hover:to-brand-900'
                                } text-white active:scale-95`}
                            >
                                {loading ? <span>Memvalidasi ke Server...</span> : <span>Kirim Presensi Sekarang</span>}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 5. SCREEN ASESMEN TILAWAH (RUBRIK STANDAR) ---
        const AssessmentScreen = ({ user, db, syncWithServer, showToast }) => {
            const myStudents = (db.users || []).filter(u => u.role === 'peserta' && u.shelter_id === user.shelter_id);
            const [selectedStudent, setSelectedStudent] = useState(myStudents[0]?.id?.toString() || '');
            const [scores, setScores] = useState({ hijaiyah: 2, lancar: 2, makhraj: 2, tajwid: 2 });
            const [assignedLevel, setAssignedLevel] = useState(1);
            const [notes, setNotes] = useState('');
            const [submitting, setSubmitting] = useState(false);

            useEffect(() => {
                const total = scores.hijaiyah + scores.lancar + scores.makhraj + scores.tajwid;
                const avg = total / 4;
                if (avg < 1.6) setAssignedLevel(0);
                else if (avg < 2.5) setAssignedLevel(1);
                else if (avg < 3.2) setAssignedLevel(2);
                else if (avg < 3.8) setAssignedLevel(3);
                else setAssignedLevel(4);
            }, [scores]);

            const currentStudentObj = myStudents.find(s => s.id === parseInt(selectedStudent));

            const handleSubmit = async () => {
                if (!selectedStudent) return showToast("Pilih santri terlebih dahulu!", 'error');
                setSubmitting(true);

                try {
                    const res = await fetch(`${API_BASE}/api/assessments`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            student_id: parseInt(selectedStudent),
                            teacher_id: user.id,
                            score_json: scores,
                            level_assigned: parseInt(assignedLevel),
                            notes: notes.trim() || 'Peserta menunjukkan komitmen yang baik dalam pembelajaran Al-Qur\'an.'
                        })
                    });

                    const data = await res.json();
                    setSubmitting(false);

                    if (data.success) {
                        showToast(`Asesmen ${currentStudentObj?.name} tersimpan di Level ${assignedLevel}!`, 'success');
                        setNotes('');
                        syncWithServer();
                    }
                } catch (e) {
                    setSubmitting(false);
                    showToast('Gagal menyimpan asesmen!', 'error');
                }
            };

            const handleScoreChange = (field, val) => setScores({ ...scores, [field]: parseInt(val) });

            return (
                <div className="space-y-4">
                    <div className="bg-gradient-to-r from-brand-900 to-teal-900 text-white p-5 rounded-3xl shadow-card">
                        <span className="text-[10px] bg-white/20 px-2 py-0.5 rounded-full font-bold uppercase tracking-wider text-emerald-200">
                            Standardisasi Tilawah Hidayatullah
                        </span>
                        <h2 className="text-base font-black mt-1">Rubrik Asesmen & Uji Kenaikan Level</h2>
                        <p className="text-xs text-brand-200">Evaluasi berkala kompetensi baca Al-Qur'an santri binaan</p>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-card space-y-4">
                        <div>
                            <label className="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1">
                                Pilih Santri Ojol
                            </label>
                            <select 
                                value={selectedStudent} 
                                onChange={e => setSelectedStudent(e.target.value)} 
                                className="w-full p-2.5 text-xs font-semibold border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 bg-slate-50/50"
                            >
                                <option value="">-- Pilih Santri --</option>
                                {myStudents.map(s => (
                                    <option key={s.id} value={s.id}>
                                        {s.name} (Saat Ini: Level {s.level !== undefined ? s.level : 0})
                                    </option>
                                ))}
                            </select>
                        </div>

                        {selectedStudent && (
                            <div className="space-y-4 pt-1">
                                {/* Rubrik 4 Aspek */}
                                <div className="space-y-2.5 bg-slate-50/80 p-4 rounded-2xl border border-slate-200">
                                    <span className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200 pb-1.5">
                                        Skor Kompetensi Rubrik (Skala 1 - 4)
                                    </span>
                                    {[
                                        { key: 'hijaiyah', label: '1. Pengenalan Huruf & Harakat' },
                                        { key: 'lancar', label: '2. Kelancaran & Artikulasi' },
                                        { key: 'makhraj', label: '3. Makharijul Huruf & Sifat' },
                                        { key: 'tajwid', label: '4. Hukum Tajwid Dasar' }
                                    ].map(item => (
                                        <div key={item.key} className="flex justify-between items-center text-xs">
                                            <span className="text-slate-700 font-semibold">{item.label}</span>
                                            <div className="flex space-x-1">
                                                {[1, 2, 3, 4].map(num => (
                                                    <button
                                                        key={num}
                                                        type="button"
                                                        onClick={() => handleScoreChange(item.key, num)}
                                                        className={`w-7 h-7 rounded-lg text-xs font-bold transition ${
                                                            scores[item.key] === num 
                                                            ? 'bg-brand-700 text-white shadow-soft' 
                                                            : 'bg-white border border-slate-200 text-slate-500 hover:bg-slate-100'
                                                        }`}
                                                    >
                                                        {num}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* Rekomendasi Level */}
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1">
                                        Penetapan Level Baru
                                    </label>
                                    <select 
                                        value={assignedLevel} 
                                        onChange={e => setAssignedLevel(e.target.value)} 
                                        className="w-full p-2.5 border border-brand-300 rounded-xl bg-brand-50 font-bold text-brand-900 text-xs focus:ring-2 focus:ring-brand-500"
                                    >
                                        <option value="0">Level 0 - Iqro 1-2 • Pengenalan Dasar</option>
                                        <option value="1">Level 1 - Iqro 3-4 • Huruf Sambung & Harakat</option>
                                        <option value="2">Level 2 - Iqro 5-6 • Kalimat & Kelancaran</option>
                                        <option value="3">Level 3 - Juz 'Amma • Tajwid & Tartil Dasar</option>
                                        <option value="4">Level 4 - Al-Qur'an 30 Juz • Tartil Mandiri</option>
                                    </select>
                                    <p className="text-[10px] text-slate-400 mt-1">*Kalkulasi otomatis berdasarkan rata-rata skor rubrik.</p>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1">
                                        Catatan Ustadz & Target Belajar
                                    </label>
                                    <textarea 
                                        value={notes} 
                                        onChange={e => setNotes(e.target.value)} 
                                        className="w-full p-2.5 border border-slate-200 rounded-xl text-xs h-20 focus:ring-2 focus:ring-brand-500" 
                                        placeholder="Tuliskan catatan perbaikan makhraj, tajwid, atau motivasi belajar..."
                                    ></textarea>
                                </div>

                                <button 
                                    onClick={handleSubmit} 
                                    disabled={submitting}
                                    className={`w-full font-bold py-3.5 rounded-xl shadow-card transition text-xs flex items-center justify-center space-x-1.5 ${
                                        submitting ? 'bg-slate-400' : 'bg-brand-700 hover:bg-brand-800'
                                    } text-white active:scale-95`}
                                >
                                    <IconCheckCircle />
                                    <span>{submitting ? 'Menyimpan ke Server...' : 'Simpan & Finalisasi Asesmen'}</span>
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- 6. SCREEN PROFIL PENGGUNA ---
        const ProfileScreen = ({ user, db, serverOnline, onLogout }) => {
            const shelter = (db.shelters || []).find(s => s.id === user.shelter_id) || db.shelters?.[0] || { name: 'Pusat' };

            return (
                <div className="space-y-4">
                    <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-card text-center">
                        <div className="w-20 h-20 bg-gradient-to-tr from-brand-800 to-teal-700 text-white rounded-full mx-auto mb-3 flex items-center justify-center text-3xl font-black shadow-glow border-2 border-white">
                            {user.name.charAt(0)}
                        </div>
                        <h2 className="text-base font-extrabold text-slate-800">{user.name}</h2>
                        <span className="inline-block mt-1 text-[10px] bg-brand-50 text-brand-800 border border-brand-200 px-2.5 py-0.5 rounded-full font-bold capitalize">
                            Peran: {user.role.replace('_', ' ')}
                        </span>

                        <div className="mt-5 border-t border-slate-100 pt-3 text-left space-y-2 text-xs">
                            <div className="flex justify-between py-1.5 border-b border-slate-50">
                                <span className="text-slate-400">Username</span>
                                <span className="font-bold text-slate-800">{user.username}</span>
                            </div>
                            <div className="flex justify-between py-1.5 border-b border-slate-50">
                                <span className="text-slate-400">Shelter Penempatan</span>
                                <span className="font-bold text-slate-800">{shelter ? shelter.name : 'Pusat'}</span>
                            </div>
                            {user.role === 'peserta' && (
                                <div className="flex justify-between py-1.5 border-b border-slate-50">
                                    <span className="text-slate-400">Level Kemampuan</span>
                                    <span className="font-bold text-brand-700">Level {user.level !== undefined ? user.level : 0}</span>
                                </div>
                            )}
                            <div className="flex justify-between py-1.5">
                                <span className="text-slate-400">Status Server</span>
                                <span className="font-bold text-emerald-600 flex items-center space-x-1">
                                    <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                                    <span>Localhost REST API (Online)</span>
                                </span>
                            </div>
                        </div>

                        <button 
                            onClick={onLogout} 
                            className="w-full mt-6 bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2.5 rounded-xl border border-red-200 transition text-xs"
                        >
                            Keluar dari Akun (Logout)
                        </button>
                    </div>

                    <div className="bg-brand-900 text-white rounded-2xl p-4 text-xs space-y-1 shadow-card border border-brand-700">
                        <p className="font-bold text-gold-300">Visi Gerakan Ojol Mengaji</p>
                        <p className="text-[11px] text-brand-100 leading-relaxed">
                            Mewujudkan pengemudi ojek online yang bertilawah tartil, berakhlak mulia, dan istiqamah dalam naungan Al-Qur'an di setiap sela perjalanan mencari nafkah yang halal.
                        </p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
